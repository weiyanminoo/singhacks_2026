<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>alternate.ai</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { --accent: #5eead4; }
  body { background: #0b0f14; color: #e6edf3; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .row { animation: fade .28s ease-out both; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .bar { transition: width .5s cubic-bezier(.4,0,.2,1); }
  .num { transition: color .3s; }
</style>
</head>
<body class="min-h-screen">
<div class="max-w-6xl mx-auto p-6 grid gap-6 md:grid-cols-[1fr_320px]">

  <!-- trace -->
  <section>
    <header class="flex items-baseline justify-between mb-4">
      <h1 class="text-xl font-semibold tracking-tight">alternate.ai</h1>
      <span id="net" class="mono text-xs text-slate-500">connecting…</span>
    </header>
    <div id="watching" class="mono text-xs text-slate-600 mb-3">
      <span class="inline-block w-1.5 h-1.5 rounded-full bg-teal-400 animate-pulse"></span>
      trigger loop watching…
    </div>
    <div id="trace" class="mono text-[13px] leading-relaxed space-y-1.5"></div>
    <div class="mt-6 flex gap-2">
      <button id="run" class="px-4 py-2 rounded-lg text-sm font-medium bg-teal-300 text-slate-900 hover:bg-teal-200">
        Fire disruption event
      </button>
      <button id="reset" class="px-4 py-2 rounded-lg text-sm font-medium border border-slate-700 text-slate-400 hover:text-slate-200">
        Reset
      </button>
    </div>
  </section>

  <!-- envelope -->
  <aside class="md:sticky md:top-6 h-fit rounded-xl border border-slate-800 bg-slate-900/40 p-5">
    <div class="text-xs uppercase tracking-wider text-slate-500">Envelope remaining</div>
    <div id="remaining" class="num mono text-4xl mt-1 tabular-nums">$10.00</div>
    <div class="mt-4 h-1.5 rounded-full bg-slate-800 overflow-hidden">
      <div id="bar" class="bar h-full rounded-full" style="width:100%;background:var(--accent)"></div>
    </div>
    <div class="mt-2 flex justify-between text-xs text-slate-500 mono">
      <span>spent <span id="spent">$0.00</span></span><span id="txcount">0 tx</span>
    </div>
    <div class="mt-5 pt-4 border-t border-slate-800">
      <div class="text-xs uppercase tracking-wider text-slate-500 mb-2">Purchases</div>
      <div id="purchases" class="space-y-2 text-xs mono text-slate-400">—</div>
    </div>
    <div class="mt-5 pt-4 border-t border-slate-800">
      <div class="text-xs uppercase tracking-wider text-slate-500 mb-1">Contingency profile</div>
      <div id="who" class="text-sm mb-2">—</div>
      <div id="notes" class="space-y-1 text-[11px] mono text-slate-500"></div>
    </div>
    <div class="mt-5 pt-4 border-t border-slate-800">
      <div class="text-xs uppercase tracking-wider text-slate-500 mb-1">Playbook</div>
      <div id="playbook" class="text-xs mono text-slate-400">—</div>
    </div>
  </aside>
</div>

<script>
const $ = s => document.querySelector(s);
const trace = $("#trace"), purchases = $("#purchases");
let txCount = 0;

const DOT = { running: "text-amber-400", done: "text-teal-300", rejected: "text-rose-400" };
const MARK = { running: "○", done: "●", rejected: "✗" };

function upsert(e) {
  let row = document.getElementById("r-" + e.id);
  if (!row) {
    row = document.createElement("div");
    row.id = "r-" + e.id;
    row.className = "row flex gap-3";
    trace.appendChild(row);
  }
  const cost = e.cost ? `<span class="text-slate-500 ml-auto shrink-0">${e.cost}</span>` : "";
  const detail = e.detail ? `<div class="text-slate-500 text-[12px]">${e.detail}</div>` : "";
  row.innerHTML =
    `<span class="${DOT[e.status] || "text-slate-500"} shrink-0">${MARK[e.status] || "○"}</span>
     <div class="min-w-0 flex-1"><div class="${e.status === "rejected" ? "text-rose-300" : ""}">${e.text}</div>${detail}</div>${cost}`;
  window.scrollTo(0, document.body.scrollHeight);
}

const es = new EventSource("/stream");
es.onmessage = ev => {
  const e = JSON.parse(ev.data);
  if (e.type === "trace") upsert(e);
  if (e.type === "envelope") {
    $("#remaining").textContent = "$" + e.remaining;
    $("#spent").textContent = "$" + e.spent;
    $("#bar").style.width = Math.max(0, e.pct * 100) + "%";
    if (e.pct < 0.35) $("#bar").style.background = "#fbbf24";
  }
  if (e.type === "purchase") {
    txCount++;
    $("#txcount").textContent = txCount + " tx";
    if (purchases.textContent === "—") purchases.innerHTML = "";
    // A simulated purchase must never look like a live explorer link — the
    // hash is invented and the link would 404. Only real settlement links out.
    const el = document.createElement(e.simulated ? "div" : "a");
    el.className = "row flex justify-between gap-2" + (e.simulated ? "" : " hover:text-teal-300");
    if (!e.simulated) { el.href = e.explorer_url + e.tx_hash; el.target = "_blank"; }
    const tag = e.simulated
      ? `<span class="text-[10px] text-amber-500/80 border border-amber-500/30 rounded px-1">simulated</span>`
      : `<span class="text-[10px] text-teal-400/80">on ledger ↗</span>`;
    el.innerHTML = `<span class="truncate">${e.label}</span>${tag}`
      + `<span class="text-slate-300 shrink-0">${e.amount}</span>`;
    purchases.appendChild(el);
  }
  if (e.type === "error") upsert({ ...e, id: "err", status: "rejected" });
};

let FIRST_EVENT = null;

fetch("/health").then(r => r.json()).then(d => {
  $("#net").textContent = `testnet · ledger ${d.ledger_index} · fee ${d.base_fee_xrp} XRP`;
}).catch(() => $("#net").textContent = "node unreachable");

fetch("/context").then(r => r.json()).then(d => {
  $("#who").textContent = d.profile.name + (d.profile.org ? " · " + d.profile.org : "");
  $("#notes").innerHTML = d.notes.map(n => `<div>· ${n}</div>`).join("");
  $("#playbook").innerHTML =
    `${d.template}<div class="text-slate-600 mt-1">${d.providers.length} providers `
    + `· executor: ${d.executor}</div>`;
  $("#remaining").textContent = "$" + Number(d.envelope.limit).toFixed(2);
  FIRST_EVENT = (d.events.find(e => e.matches) || d.events[0] || {}).id;
});

function clearAll() {
  trace.innerHTML = ""; purchases.innerHTML = "—"; txCount = 0;
  $("#txcount").textContent = "0 tx";
  $("#bar").style.width = "100%"; $("#bar").style.background = "var(--accent)";
}

$("#run").onclick = () => {
  clearAll();
  fetch("/fire/" + (FIRST_EVENT || "evt-001"), { method: "POST" });
};
$("#reset").onclick = () => { clearAll(); fetch("/reset", { method: "POST" }); };
</script>
</body>
</html>
